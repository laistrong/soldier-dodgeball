<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小兵躲避球：接力盃</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142b25;color:#fff8df;font:16px system-ui,sans-serif}main{width:min(94%,660px);margin:24px auto}h1{font-size:clamp(29px,7vw,51px);margin:0}p{margin:8px 0;color:#d4e5c9}.hud,.controls{display:flex;justify-content:space-between;gap:8px;margin:12px 0}.hud span{background:#253f32;border-radius:10px;padding:8px;flex:1;text-align:center}.court{position:relative;border:3px solid #f5d476;border-radius:18px;overflow:hidden}canvas{display:block;width:100%;height:auto;touch-action:none}.screen{position:absolute;inset:0;background:#10261fdb;display:grid;place-content:center;text-align:center;padding:18px}.screen[hidden]{display:none}h2{font-size:clamp(22px,6vw,37px);margin:0}button{font:700 17px system-ui;border:0;border-radius:10px;background:#f5d476;color:#162d22;min-height:48px;padding:10px 18px;touch-action:none;cursor:pointer}.controls button{flex:1}.screen button{justify-self:center;margin-top:12px}button:focus-visible{outline:3px solid #fff;outline-offset:-5px}
.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.pick{background:#253f32;color:#fff8df;text-align:left;font-size:14px;padding:8px 10px;border:2px solid transparent}.pick[aria-pressed=true]{border-color:#f5d476}.pick small{display:block;color:#d4e5c9}button:disabled{opacity:.55;cursor:not-allowed}.hud{flex-wrap:wrap}.hud span{min-width:66px;font-size:14px}.controls button{box-shadow:0 4px 0 #8f7339;user-select:none;-webkit-user-select:none}.controls button:active,.controls button.pressed{transform:translateY(3px);box-shadow:0 1px 0 #8f7339;background:#ffe79e}</style>
<main><h1>小兵躲避球：接力盃</h1><p>從四位隊員挑三位，依選擇順序輪替。閃過三球就能丟蓄力球。</p><section id="selection"><h2>選擇你的隊伍</h2><div class="roster" id="roster"></div><p id="lineup" aria-live="polite"></p></section><p id="matchup"></p><div class="hud"><span>分數 <b id="score">0</b></span><span>隊員 <b id="hp">3</b></span><span>倒數 <b id="time">60</b></span><span>蓄力 <b id="charge">0/3</b></span></div>
<div class="court"><canvas id="court" width="560" height="470" aria-label="躲避球球場"></canvas><div class="screen" id="screen"><h2 id="heading">準備上場</h2><p id="hint">選好三位再上場。60 秒內擊退三名對手即可獲勝。</p><button id="start">開始</button></div></div>
<div class="controls"><button id="left" aria-label="左移">◀</button><button id="throw">反擊</button><button id="right" aria-label="右移">▶</button></div><p>電腦：← → 或 A、D 移動，空白鍵反擊。手機：在下半場點按或拖動來移動，點上半場丟球。也可以用畫面按鈕。</p></main>
<script>
const el=id=>document.getElementById(id);
const court=el('court'), ctx=court.getContext('2d');
const inputs=new Set(), W=560,H=470;
const roster=[
 {name:'飛燕', role:'快腳型', speed:355, hearts:1, throwSpeed:490, damage:1, color:['#74bdbc','#285961']},
 {name:'山盾', role:'耐打型', speed:225, hearts:3, throwSpeed:450, damage:1, color:['#b6ad68','#2a4834']},
 {name:'火栗', role:'重砲型', speed:255, hearts:1, throwSpeed:650, damage:2, color:['#e2a657','#7a4732']},
 {name:'青禾', role:'全能型', speed:295, hearts:2, throwSpeed:515, damage:1, color:['#9fd78a','#416c40']}
];
const lineup=[];
let stamina=0, rival=0, rivalHealth=4;
const ally=()=>roster[lineup[Math.min(lineup.length-1,3-hp)] ?? 0];
function pick(index){
 const position=lineup.indexOf(index);
 if(position>=0)lineup.splice(position,1);
 else if(lineup.length<3)lineup.push(index);
 renderRoster();
}
const cards=roster.map((member,index)=>{
 const button=document.createElement('button');
 button.className='pick';
 button.addEventListener('click',()=>pick(index));
 el('roster').append(button);
 return button;
});
function renderRoster(){
 cards.forEach((button,i)=>{
  const member=roster[i], position=lineup.indexOf(i);
  button.setAttribute('aria-pressed',String(position>=0));
  button.disabled=position<0&&lineup.length===3;
  const details=document.createElement('small');
  details.textContent='速度 '+member.speed+' · 耐力 '+member.hearts+' · 球力 '+member.damage;
  button.replaceChildren((position>=0?(position+1)+'. ':'')+member.name+'｜'+member.role,details);
 });
 el('lineup').textContent='上場順序：'+(lineup.map(i=>roster[i].name).join(' → ')||'尚未選角')+'（'+lineup.length+'/3）';
 el('start').disabled=lineup.length!==3;
}
renderRoster();
let charge=0, touchTarget=null;
let active=false, player=280, enemy=280, hp=3, points=0, t=0, next=0, cooldown=0, inv=0, balls=[], flash=0;
function stats(){el('matchup').textContent=ally().name+'｜耐力 '+stamina+'　對手 '+Math.min(rival+1,3)+'/3｜耐力 '+rivalHealth;el('charge').textContent=charge===3?'就緒':charge+'/3';el('throw').textContent=charge===3?'蓄力反擊':'反擊';el('hp').textContent=hp;el('score').textContent=points;el('time').textContent=Math.max(0,Math.ceil(60-t));}
function start(){if(lineup.length!==3)return;active=true;touchTarget=null;player=enemy=280;hp=3;stamina=ally().hearts;rival=0;rivalHealth=4;el('selection').hidden=true;charge=0;points=t=cooldown=inv=flash=0;next=.55;balls=[];inputs.clear();el('screen').hidden=true;stats();}
function end(){active=false;inputs.clear();el('selection').hidden=false;el('heading').textContent=rival===3?'接力盃獲勝！':hp?'時間到！':'全隊退場';el('hint').textContent='這一輪拿到 '+points+' 分';el('start').textContent='再玩一次';el('screen').hidden=false;el('start').focus();}
function toss(){if(!active||cooldown>0)return;cooldown=.43;const power=charge===3;if(power)charge=0;balls.push({x:player,y:399,vx:0,vy:-(ally().throwSpeed+(power?200:0)),damage:ally().damage+(power?1:0),team:true,power});}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}
function soldier(x,y,uniform,helmet){
 ctx.fillStyle='#142b25';ctx.fillRect(x-15,y+10,12,12);ctx.fillRect(x+3,y+10,12,12);
 ctx.fillStyle=uniform;ctx.fillRect(x-21,y-2,42,17);circle(x,y-11,18,'#f6c697');
 ctx.fillStyle=helmet;ctx.fillRect(x-21,y-19,42,8);ctx.beginPath();ctx.arc(x,y-19,19,Math.PI,0);ctx.fill();
 circle(x-6,y-7,2,'#192623');circle(x+6,y-7,2,'#192623');
}
function draw(){
 ctx.fillStyle=flash>0?'#75504a':'#48674c';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#567653';for(let x=0;x<W;x+=80)ctx.fillRect(x,0,40,H);
 ctx.strokeStyle='#f0dea7';ctx.lineWidth=3;ctx.strokeRect(22,22,W-44,H-44);
 ctx.beginPath();ctx.moveTo(22,235);ctx.lineTo(W-22,235);ctx.stroke();
 ctx.beginPath();ctx.arc(280,235,48,0,Math.PI*2);ctx.stroke();
 for(let i=0;i<12;i++){ctx.fillStyle=i%2?'#edc56e':'#314a39';ctx.fillRect(22+i*43,22,43,7);ctx.fillRect(22+i*43,H-29,43,7);}
 if(rival<3)soldier(enemy,56,['#ad5c4d','#b487b9','#c17e4c'][rival],'#573735');
 if(inv<=0||Math.floor(inv*13)%2===0)soldier(player,424,...ally().color);
 for(const b of balls){circle(b.x,b.y,b.power?16:10,b.power?'#91eff6':b.team?'#f5d476':'#ff856e');circle(b.x-3,b.y-4,3,'#fff0c9');}
}
function step(dt){
 t+=dt;cooldown-=dt;inv-=dt;flash-=dt;
 const right=inputs.has('ArrowRight')||inputs.has('d'),left=inputs.has('ArrowLeft')||inputs.has('a');
 const direction=Number(right)-Number(left);
 if(direction)touchTarget=null;
 const reach=ally().speed*dt;
 const delta=touchTarget===null?reach*direction:Math.max(-reach,Math.min(reach,touchTarget-player));
 player=Math.max(40,Math.min(520,player+delta));
 enemy=280+202*Math.sin(t*(1.25+t/85));
 if(inputs.has(' '))toss();
 if(t>=next){next=t+Math.max(.42,1.22-t*.015);const vy=225+t*2.4+rival*18;balls.push({x:enemy,y:78,vx:(player-enemy)*vy/345,vy,team:false});}
 balls=balls.filter(b=>{
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.team&&rival<3&&Math.hypot(b.x-enemy,b.y-56)<(b.power?36:27)){points+=b.power?200:100;rivalHealth=Math.max(0,rivalHealth-b.damage);if(rivalHealth===0&&++rival<3)rivalHealth=4;return false;}
   if(!b.team&&Math.hypot(b.x-player,b.y-416)<27&&inv<=0){if(--stamina===0){hp--;if(hp>0)stamina=ally().hearts;}inv=.9;flash=.23;return false;}
   if(!b.team&&b.y>H+10){points+=10;charge=Math.min(3,charge+1);return false;}
   return b.y>-15;
 });
 stats();if(hp<=0||t>=60||rival===3)end();
}
let last=performance.now();
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(active)step(dt);draw();requestAnimationFrame(frame);}
el('start').onclick=start;
el('throw').onpointerdown=event=>{if(event.button===0)toss();};
el('throw').onclick=event=>{if(event.detail===0)toss();};
for(const [id,key] of [['left','ArrowLeft'],['right','ArrowRight']]){
 const button=el(id);
 button.onpointerdown=e=>{button.setPointerCapture(e.pointerId);inputs.add(key);button.classList.add("pressed");};
 for(const event of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(event,()=>{inputs.delete(key);button.classList.remove("pressed");});
}
function drag(e){const rect=court.getBoundingClientRect();touchTarget=Math.max(40,Math.min(520,(e.clientX-rect.left)*W/rect.width));}
court.onpointerdown=e=>{if(!active||e.button!==0)return;
 const rect=court.getBoundingClientRect();
 if(e.clientY<rect.top+rect.height/2){toss();return;}
 court.setPointerCapture(e.pointerId);drag(e);};
court.onpointermove=e=>{if(active&&court.hasPointerCapture(e.pointerId))drag(e);};
window.addEventListener('keydown',e=>{const key=e.key.toLowerCase();const control=key.startsWith('arrow')?e.key:key;if(active&&['ArrowLeft','ArrowRight','a','d',' '].includes(control)){e.preventDefault();inputs.add(control);if(control===' ')toss();}});
window.addEventListener('keyup',e=>inputs.delete(e.key.length===1?e.key.toLowerCase():e.key));
window.addEventListener('blur',()=>inputs.clear());
requestAnimationFrame(frame);
</script></html>
